# Publishes @eminzo/factory to npm from a vX.Y.Z tag, with provenance.
# npm trusts this workflow as its Trusted Publisher, so no npm token is stored anywhere,
# and the `npm` environment asks a maintainer to approve each publish.
# Pull requests run the same checks without publishing. See docs/releasing.md.
name: Publish CLI

on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Git identity for the tests that commit
        run: git config --global user.name "eminzo-ci" && git config --global user.email "eminzo-ci@users.noreply.github.com"
      - run: npm ci
      - run: npm test
      - name: Build and pack the CLI
        run: npm pack --dry-run
        working-directory: cli

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1 or newer, which trusted publishing needs
        run: npm install -g npm@^11.5.1
      - name: The tag matches the CLI version
        run: test "v$(jq -r .version cli/package.json)" = "$GITHUB_REF_NAME"
      - run: npm ci
      - name: Build the CLI
        run: node build.mjs
        working-directory: cli
      # The verify job already ran the tests on this commit, so the lifecycle scripts are skipped here.
      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts
        working-directory: cli
