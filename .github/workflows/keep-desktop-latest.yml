# Keeps the newest published desktop release marked "Latest".
# The desktop app updates through /releases/latest; a CLI release must never take that slot.
# See docs/releasing.md.
name: Keep desktop release Latest

on:
  release:
    types: [published, edited]

permissions:
  contents: write

concurrency:
  group: keep-desktop-latest
  cancel-in-progress: false

jobs:
  keep-latest:
    # Desktop releases are the ones that should be Latest: only react to the others.
    if: ${{ !startsWith(github.event.release.tag_name, 'desktop-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore Latest to the newest desktop release
        run: node scripts/keep-desktop-latest.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
